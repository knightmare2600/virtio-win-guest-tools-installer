name: WiX 6 arm64 build and checks

# Fork-only CI for the arm64 work: NOT part of the upstream pull request.
# Builds the DrvInstCA custom action for ARM64, the arm64 driver MSI and a test bundle on the free
# windows-latest runner (cross-compiling; no arm64 runner is needed), then asserts on the built MSI's
# tables the things that previously only showed up on a real install.

on:
  push:
    branches: [arm64-wix6-ci]
  workflow_dispatch:

env:
  WIX3_DIR: ${{ github.workspace }}\wix314
  SOLUTION_DIR: ${{ github.workspace }}\src\DrvInst\
  VERSION: '0.0.6'

jobs:
  ca:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WiX 3.14.1 SDK (arm64 static libs for the CA; the MSI itself is built with WiX 6)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile "$env:RUNNER_TEMP\wix314-binaries.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wix314-binaries.zip" -DestinationPath "${{ env.WIX3_DIR }}"
          if (-not (Test-Path "${{ env.WIX3_DIR }}\sdk\vs2017\lib\arm64\dutil.lib")) { throw "arm64 SDK libs missing" }
      - uses: microsoft/setup-msbuild@v2
      - name: Detect installed Windows SDK
        id: sdk
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1
          "version=$($sdk.Name)" >> $env:GITHUB_OUTPUT
      - name: Build DrvInstCA.dll (Release and Debug, ARM64)
        shell: pwsh
        run: |
          foreach ($cfg in "Release", "Debug") {
            msbuild src\DrvInst\DrvInstCA\DrvInstCA.vcxproj `
              /p:Configuration=$cfg /p:Platform=ARM64 `
              /p:WIX="${{ env.WIX3_DIR }}\" /p:WixPlatformToolset=VS2017 `
              /p:WindowsTargetPlatformVersion=${{ steps.sdk.outputs.version }} `
              /p:SolutionDir="${{ env.SOLUTION_DIR }}" /p:PlatformTarget=arm64 /m
            if ($LASTEXITCODE -ne 0) { throw "DrvInstCA $cfg|ARM64 build failed" }
          }
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item src\DrvInst\Install\Release\arm64\DrvInstCA.dll out\
          Get-FileHash out\DrvInstCA.dll -Algorithm SHA256
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with: { name: DrvInstCA-arm64, path: out/, if-no-files-found: error }

  msi:
    needs: ca
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: DrvInstCA-arm64, path: Libraries/arm64 }
      - name: Fetch arm64 driver content (repack of the official virtio-win tree)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/qemus/virtiso-arm/releases/download/v0.1.285-1/virtio-win-0.1.285.tar.xz" `
            -OutFile "$env:RUNNER_TEMP\drivers.tar.xz"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\drivers" | Out-Null
          tar -xf "$env:RUNNER_TEMP\drivers.tar.xz" -C "$env:RUNNER_TEMP\drivers"
          Get-ChildItem "$env:RUNNER_TEMP\drivers"
      - name: Build the arm64 driver MSI with WiX 6
        shell: pwsh
        run: |
          dotnet build virtio-win-drivers-installer\virtio-win-drivers-installer.wixproj -c Release `
            -p:Platform=arm64 -p:InstallerVersion=${{ env.VERSION }} `
            -p:VirtioWinDriversPath="$env:RUNNER_TEMP\drivers"
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }
          Get-ChildItem -Recurse virtio-win-drivers-installer\bin -Filter *.msi | ForEach-Object { $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: virtio-win-gt-arm64-msi
          path: virtio-win-drivers-installer/bin/**/virtio-win-gt-arm64.msi
          if-no-files-found: error

  check:
    needs: msi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: virtio-win-gt-arm64-msi, path: msi }
      - name: Install msitools (the tool upstream's own test/test.py uses)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools
      - name: Assert on the built MSI (what previously needed a real install to find)
        shell: bash
        run: |
          set -u
          M=$(find msi -name virtio-win-gt-arm64.msi | head -1)
          echo "MSI: $M"
          fail=0
          check() { if eval "$2"; then echo "PASS  $1"; else echo "FAIL  $1"; fail=$((fail+1)); fi; }
          exp() { msiinfo export "$M" "$1" 2>&1; }
          echo "=== summary ===";        msiinfo suminfo "$M"
          echo "=== AppSearch ===";      exp AppSearch
          echo "=== RegLocator ===";     exp RegLocator
          echo "=== LaunchCondition ==="; exp LaunchCondition
          echo "=== Feature ===";        exp Feature | cut -f1
          echo "=== CustomAction (ProcessPackages) ==="; exp CustomAction | grep -i ProcessPackages
          echo "=== Property (selected) ==="; exp Property | grep -E "^(UpgradeCode|SecureCustomProperties|ProductVersion|ALLUSERS|arm64_Validation|Set_ProcessorArchitecture)"
          echo
          check "Template summary property declares Arm64" 'msiinfo suminfo "$M" | grep -q "Arm64;1033"'
          check "AppSearch has REGISTRY_PROCESSOR_ARCHITECTURE (the missing-fragment bug that blocked the first install)" 'exp AppSearch | grep -q REGISTRY_PROCESSOR_ARCHITECTURE'
          check "RegLocator reads PROCESSOR_ARCHITECTURE" 'exp RegLocator | grep -q PROCESSOR_ARCHITECTURE'
          check "arm64 launch condition present" 'exp LaunchCondition | grep -q "REGISTRY_PROCESSOR_ARCHITECTURE = \"ARM64\""'
          check "SecureCustomProperties lists REGISTRY_PROCESSOR_ARCHITECTURE" 'exp Property | grep "^SecureCustomProperties" | grep -q REGISTRY_PROCESSOR_ARCHITECTURE'
          check "UpgradeCode is the arm64 one" 'exp Property | grep -q "^UpgradeCode.*{10725300-348B-4908-B52E-4D71B15480F4}"'
          check "ProcessDriverPackages custom action present" 'exp CustomAction | grep -q ProcessPackages'
          for f in FE_pvpanic_driver FE_fwcfg_driver FE_qemupciserial_driver FE_viofs_driver; do
            check "$f is not packaged on arm64" '! exp Feature | cut -f1 | grep -qx "$f"'
          done
          for f in FE_balloon_driver FE_network_driver FE_vioinput_driver FE_viorng_driver FE_vioscsi_driver FE_vioserial_driver FE_viostor_driver FE_viogpudo_driver FE_viomem_driver; do
            check "$f is packaged" 'exp Feature | cut -f1 | grep -qx "$f"'
          done
          check "no x64/x86 driver components leaked in" '! exp Component | cut -f1 | grep -Eq "_(amd64|x86)$|Win10x64|Win11x64|WinServer20|Win10x86"'
          echo; echo "failures: $fail"; [ "$fail" -eq 0 ]

  bundle:
    needs: msi
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: virtio-win-gt-arm64-msi, path: stage }
      - uses: actions/download-artifact@v4
        with: { name: DrvInstCA-arm64, path: Libraries/arm64 }
      - name: Get a real qemu-ga arm64 MSI and placeholder MSIs for the packages that are inert on arm64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # the artifact keeps the build output's subfolders; flatten it
          $built = Get-ChildItem -Recurse stage -Filter virtio-win-gt-arm64.msi | Select-Object -First 1
          Move-Item $built.FullName stage\virtio-win-gt-arm64.msi -Force
          gh release download arm64-preview-0.0.5 --repo ${{ github.repository }} -p qemu-ga-arm64.msi -D stage
          # The x64/x86/Spice slots need valid MSIs with distinct ProductCodes (Burn rejects duplicate CacheIds).
          # They are never installed on arm64 (their conditions are false there). TEST BUNDLE ONLY.
          New-Item -ItemType Directory -Force -Path ph | Out-Null
          Set-Content ph\ph.txt "placeholder"
          Set-Content ph\ph.wxs @'
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="$(env.PhName)" Manufacturer="placeholder" Version="1.0.0" ProductCode="$(env.PhGuid)" UpgradeCode="$(env.PhUpg)" Scope="perMachine" InstallerVersion="500">
              <MediaTemplate EmbedCab="yes" />
              <Feature Id="F" Level="1"><ComponentGroupRef Id="G" /></Feature>
            </Package>
            <Fragment>
              <StandardDirectory Id="ProgramFiles6432Folder"><Directory Id="D" Name="placeholder" /></StandardDirectory>
              <ComponentGroup Id="G" Directory="D"><Component Guid="*"><File Source="ph.txt" /></Component></ComponentGroup>
            </Fragment>
          </Wix>
          '@
          Set-Content ph\ph.wixproj @'
          <Project Sdk="WixToolset.Sdk/6.0.2">
            <PropertyGroup><Platform Condition=" '$(Platform)' == '' ">x64</Platform><SuppressValidation>true</SuppressValidation></PropertyGroup>
          </Project>
          '@
          foreach ($n in "ph-drv-x64","ph-drv-x86","ph-spice-driver-x64","ph-spice-driver-x86","ph-spice-vdagent-x64","ph-spice-vdagent-x86","ph-qemu-ga-x64","ph-qemu-ga-x86") {
            # passed through the environment: the WiX preprocessor reads it as $(env.X), which avoids MSBuild
            # splitting a DefineConstants value on semicolons
            $env:PhName = $n
            $env:PhGuid = "{" + [guid]::NewGuid().ToString().ToUpper() + "}"
            $env:PhUpg  = "{" + [guid]::NewGuid().ToString().ToUpper() + "}"
            dotnet build ph\ph.wixproj -c Release -p:OutputName=$n -p:OutDir="${{ github.workspace }}\stage\" -p:IntermediateOutputPath="obj\$n\"
            if ($LASTEXITCODE -ne 0) { throw "placeholder $n failed" }
          }
          Get-ChildItem stage
      - name: Build the test bundle (IncludeArm64=true, with an arm64 qemu-ga)
        shell: pwsh
        run: |
          $s = "${{ github.workspace }}\stage"
          dotnet build virtio-win-installers-bundler\virtio-win-installers-bundler.wixproj -c Release `
            -p:InstallerVersion=${{ env.VERSION }} -p:BuildBundledDriverMsis=false -p:IncludeArm64=true `
            -p:VirtioWinGtX64MsiPath="$s\ph-drv-x64.msi" -p:VirtioWinGtX86MsiPath="$s\ph-drv-x86.msi" `
            -p:VirtioWinGtArm64MsiPath="$s\virtio-win-gt-arm64.msi" -p:QemuGaArm64MsiPath="$s\qemu-ga-arm64.msi" `
            -p:SpiceDriver64MsiPath="$s\ph-spice-driver-x64.msi" -p:SpiceDriver86MsiPath="$s\ph-spice-driver-x86.msi" `
            -p:SpiceVdagent64MsiPath="$s\ph-spice-vdagent-x64.msi" -p:SpiceVdagent86MsiPath="$s\ph-spice-vdagent-x86.msi" `
            -p:QemuGa64MsiPath="$s\ph-qemu-ga-x64.msi" -p:QemuGa86MsiPath="$s\ph-qemu-ga-x86.msi"
          if ($LASTEXITCODE -ne 0) { throw "bundle build (arm64 included) failed" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item (Get-ChildItem -Recurse virtio-win-installers-bundler\bin -Filter virtio-win-guest-tools.exe | Select-Object -First 1).FullName out\virtio-win-guest-tools-TEST-arm64.exe
      - name: Build the bundle again with arm64 excluded (regression check for the default path)
        shell: pwsh
        run: |
          $s = "${{ github.workspace }}\stage"
          dotnet build virtio-win-installers-bundler\virtio-win-installers-bundler.wixproj -c Release --no-incremental `
            -p:InstallerVersion=${{ env.VERSION }} -p:BuildBundledDriverMsis=false -p:IncludeArm64=false `
            -p:VirtioWinGtX64MsiPath="$s\ph-drv-x64.msi" -p:VirtioWinGtX86MsiPath="$s\ph-drv-x86.msi" `
            -p:SpiceDriver64MsiPath="$s\ph-spice-driver-x64.msi" -p:SpiceDriver86MsiPath="$s\ph-spice-driver-x86.msi" `
            -p:SpiceVdagent64MsiPath="$s\ph-spice-vdagent-x64.msi" -p:SpiceVdagent86MsiPath="$s\ph-spice-vdagent-x86.msi" `
            -p:QemuGa64MsiPath="$s\ph-qemu-ga-x64.msi" -p:QemuGa86MsiPath="$s\ph-qemu-ga-x86.msi"
          if ($LASTEXITCODE -ne 0) { throw "bundle build (arm64 excluded) failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: TEST-bundle-arm64
          path: |
            out/virtio-win-guest-tools-TEST-arm64.exe
          if-no-files-found: error
